<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:;">
  <title>EasyLens lens</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 190px;
      height: 114px;
      opacity: 1;
      transition: opacity 20ms linear;
    }
  </style>
</head>
<body>
  <canvas id="lens" width="190" height="114" aria-hidden="true"></canvas>
  <script src="lens-scheduler.js"></script>
  <script src="lens.js"></script>
</body>
</html>

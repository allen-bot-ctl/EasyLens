<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';">
  <title>EasyLens card</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      box-sizing: border-box;
      padding: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    .card {
      box-sizing: border-box;
      width: max-content;
      max-width: 460px;
      min-width: 200px;
      padding: 12px 18px 14px;
      border-radius: 14px;
      border: 0.8px solid rgba(230, 232, 238, 0.18);
      background: rgba(20, 22, 27, 0.95);
      color: #fff;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.36);
      animation: appear 120ms ease-out;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(3px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .title {
      margin: 0 0 7px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      color: rgba(196, 202, 214, 0.92);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 430px;
    }
    .text {
      margin: 0;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 500;
      color: #fff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .text.selection {
      font-size: 15px;
      line-height: 1.62;
      font-weight: 450;
    }
    .loading-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0 4px;
      font-size: 15px;
      font-weight: 500;
      color: rgba(236, 239, 246, 0.94);
    }
    .dots {
      display: inline-flex;
      gap: 5px;
      margin-left: 3px;
      padding-bottom: 2px;
    }
    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(240, 243, 250, 0.92);
      opacity: 0.22;
      animation: pulse 1.15s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 160ms; }
    .dot:nth-child(3) { animation-delay: 320ms; }
    @keyframes pulse {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.9; }
    }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      line-height: 15px;
      color: rgba(190, 196, 208, 0.72);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section class="card" id="card" role="status" aria-live="polite">
    <div class="title" id="title"></div>
    <p class="text" id="text"></p>
    <div class="loading-row" id="loading" hidden>
      <span>正在转译</span>
      <span class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    </div>
    <div class="hint" id="hint" hidden></div>
  </section>
  <script src="card.js"></script>
</body>
</html>

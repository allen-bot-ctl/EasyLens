name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag
        type: string
        required: true
      commit:
        description: Exact approved master commit
        type: string
        required: true

permissions: {}

concurrency:
  group: release-stable
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  APPROVED_SHA: ${{ inputs.commit }}

jobs:
  preflight:
    name: Verify release tag and successful master CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - name: Checkout exact candidate, or the tag for the historical tag-push entry
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, branch and verification evidence
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_ACTOR_ID" = 352863755 || "$GITHUB_ACTOR" = 'github-actions[bot]' ]]
          sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$sha" = "$APPROVED_SHA"
            test "$GITHUB_REF" = refs/heads/master
            test "$GITHUB_WORKFLOW_SHA" = "$sha"
          fi
          git fetch --no-tags origin "refs/tags/$TAG:refs/release-verify/$TAG" refs/heads/master
          test "$(git rev-parse "refs/release-verify/$TAG^{commit}")" = "$sha"
          git merge-base --is-ancestor "$sha" FETCH_HEAD
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" \
            -f branch=master -f "head_sha=$sha" -f event=push -f status=success \
            --jq '.workflow_runs[].id' | grep -Eq '^[0-9]+$'
          test -s "release-notes/$TAG.md"
          test "v$(node -p 'require("./package.json").version')" = "$TAG"
          echo "commit=$sha" >> "$GITHUB_OUTPUT"

  package:
    needs: preflight
    uses: ./.github/workflows/package-app.yml
    permissions:
      contents: read
    with:
      commit: ${{ needs.preflight.outputs.commit }}
      upload: true
    secrets:
      EASYLENS_SIGN_P12: ${{ secrets.EASYLENS_SIGN_P12 }}
      EASYLENS_SIGN_PASSWORD: ${{ secrets.EASYLENS_SIGN_PASSWORD }}

  publish:
    name: Publish GitHub Release
    needs: [preflight, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          NOTES="release-notes/${TAG}.md"
          [ -s "$NOTES" ] || { echo "::error::缺少发版说明 $NOTES"; exit 1; }
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Recheck exact remote tag and prevent updating an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.preflight.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG:refs/release-publish/$TAG"
          test "$(git rev-parse "refs/release-publish/$TAG^{commit}")" = "$VERIFIED_SHA"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          python3 - "$latest" "$TAG" <<'PYCODE'
          import re
          import sys
          def version(value):
              if not re.fullmatch(r"v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)", value):
                  raise SystemExit("invalid stable tag")
              return tuple(map(int, value[1:].split(".")))
          if version(sys.argv[2]) <= version(sys.argv[1]):
              raise SystemExit("refusing to move latest back or overwrite a release")
          PYCODE
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>"$RUNNER_TEMP/existing-release.err"; then
            echo "::error::release already exists"
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/existing-release.err"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EasyLens ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          overwrite_files: false
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.AppImage
            dist/EasyLens-*-linux-*-dir.zip
            dist/EasyLens-*-win-*.exe
            dist/EasyLens-*-mac-x64.dmg
            dist/EasyLens-*-mac-x64.zip
            dist/EasyLens-*-mac-x64.zip.sha256
            dist/EasyLens-*-mac-arm64.dmg
            dist/EasyLens-*-mac-arm64.zip
            dist/EasyLens-*-mac-arm64.zip.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
